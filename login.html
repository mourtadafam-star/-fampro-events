<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b30712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="092508DF-3780-43EC-8976-384F9EF65BE0.png">
  <title>Connexion | FAMpro Évents</title>
  <style>
    :root{--blue:#1677c8;--ink:#102a43;--muted:#627d98;--line:#d9e2ec}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#e8f3fc,#f5f8fb)}
    main{width:min(100%,420px);padding:34px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px #102a4320}
    .brand{margin:0;color:var(--ink);font-size:26px;font-weight:800} h1{margin:28px 0 8px;font-size:22px} p{color:var(--muted);margin:0 0 24px} label{display:block;margin-bottom:8px;font-weight:650} input,button{width:100%;border-radius:10px;font:inherit} input{padding:12px 13px;border:1px solid #bcccdc} button{margin-top:16px;padding:13px;border:0;background:var(--blue);color:#fff;font-weight:750;cursor:pointer} button:disabled{opacity:.65;cursor:wait} #message{min-height:24px;margin:16px 0 0;font-size:14px}.success{color:#137333}.error{color:#b42318}.note{margin-top:20px;font-size:13px}
  </style>
</head>
<body>
  <main>
    <p class="brand">FAMpro Évents</p>
    <h1>Connexion sécurisée</h1>
    <p>Entrez votre adresse e-mail et votre mot de passe pour accéder à FAMpro Évents.</p>
    <form id="login-form">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="vous@exemple.com">
      <label for="password" style="margin-top:16px">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe">
      <button id="submit" type="submit">Se connecter</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Les données clients restent privées et ne sont chargées qu’après connexion.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const SUPABASE_URL = 'https://paegdthtusbwxuarhacb.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_OBQ-QtNhsEX5GJvStmY5JQ_Z0QwaWNm';
      let supabaseClient;
      const form = document.querySelector('#login-form');
      const emailInput = document.querySelector('#email');
      const passwordInput = document.querySelector('#password');
      const button = document.querySelector('#submit');
      const message = document.querySelector('#message');
      const appUrl = new URL('./', window.location.href).href;
      const showMessage = (text, type = '') => { message.textContent = text; message.className = type; };
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (button.disabled) return;
        button.disabled = true;
        showMessage('Connexion en cours…');
        try {
          const { error } = await supabaseClient.auth.signInWithPassword({
            email: emailInput.value.trim(),
            password: passwordInput.value
          });
          if (error) {
            showMessage(error.message, 'error');
            return;
          }
          window.location.replace(appUrl);
        } catch (error) {
          showMessage(error.message || 'Impossible de se connecter. Vérifiez vos informations.', 'error');
        } finally {
          button.disabled = false;
        }
      });
      async function initializeAuth() {
        try {
          if (!window.supabase?.createClient) {
            button.disabled = true;
            showMessage('Le service de connexion n’a pas pu être chargé. Rechargez la page pour réessayer.', 'error');
            return;
          }
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
          const { data, error } = await supabaseClient.auth.getSession();
          if (error) throw error;
          if (data.session) window.location.replace(appUrl);
        } catch (error) {
          // A late session-check failure must not replace the form result.
          if (!message.textContent) showMessage(error.message || 'Impossible de vérifier la session.', 'error');
          if (!supabaseClient) button.disabled = true;
        }
      }
      initializeAuth();
    })();
  </script>
</body>
</html>
